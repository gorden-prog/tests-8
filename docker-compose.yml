services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:////data/worldatlas.db"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
      REST_COUNTRIES_API_KEY: "${REST_COUNTRIES_API_KEY:-}"
    volumes:
      - worldatlas-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  worldatlas-data:
